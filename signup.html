<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | YTH Movie Booking</title>
    <link rel="stylesheet" href="assets/css/signup.css">


</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <a href="index.html" class="logo">

            <img
                src="assets/images/logo.png"
                alt="YTH Movie Booking Logo"
            >

        </a>

        <a
            href="index.html"
            class="back-home"
        >
            ← Back to Home
        </a>

    </nav>


    <!-- ================= SIGNUP SECTION ================= -->

    <section class="signup-section">

        <div class="signup-box">

            <h1 class="signup-title">
                Create <span>YTH</span> Account
            </h1>

            <p class="signup-subtitle">
                Create your account and start booking movies
            </p>


            <!-- ================= FORM ================= -->

            <form id="signupForm">

                <!-- Full Name -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', this)"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirmPassword', this)"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Terms -->

                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the
                        <a href="#">
                            Terms & Conditions
                        </a>
                        and
                        <a href="#">
                            Privacy Policy
                        </a>.
                    </span>

                </label>


                <!-- Create Account -->

                <button
                    type="submit"
                    class="signup-btn"
                >
                    Create Account
                </button>

            </form>


            <!-- Divider -->

            <div class="divider">
                OR
            </div>


            <!-- Login -->

            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <!-- Demo Notice -->

            <div class="demo-notice">

                <strong>Demo Signup:</strong>
                This is a frontend-only college project.
                No real account or password is stored.

            </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026
            <span>YTH Movie Booking</span>.
            All Rights Reserved.
        </p>

    </footer>



<script src="assets/js/signup.js"></script></body>
</html>

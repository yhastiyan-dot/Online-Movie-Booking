<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | YTH Movie Booking</title>
    <link rel="stylesheet" href="assets/css/login.css">


</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <a href="index.html" class="logo">
            <img src="assets/images/logo.png" alt="YTH Movie Booking Logo">
        </a>

        <a href="index.html" class="back-home">
            ← Back to Home
        </a>

    </nav>


    <!-- ================= LOGIN SECTION ================= -->

    <section class="login-section">

        <div class="login-box">

            <h1 class="login-title">
                Welcome to <span>YTH</span>
            </h1>

            <p class="login-subtitle">
                Login to continue your movie booking experience
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm">

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Options -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>

                    <a
                        href="#"
                        class="forgot"
                        onclick="forgotPassword()"
                    >
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <!-- Divider -->

            <div class="divider">
                OR
            </div>


            <!-- Signup -->

            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Create Account
                </a>

            </p>


            <!-- Demo Notice -->

            <div class="demo-notice">

                <strong>Demo Login:</strong>
                This is a frontend-only project.
                No real user account or password is stored.

            </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 <span>YTH Movie Booking</span>.
            All Rights Reserved.
        </p>

    </footer>




<script src="assets/js/login.js"></script>
</body>
</html>
